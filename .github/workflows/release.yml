name: Release

on:
    release:
        types: [published]

jobs:
    ci:
        name: Verificar código
        uses: ./.github/workflows/ci.yml

    docker:
        name: Publicar imagen en Docker Hub
        needs: ci
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.meta.outputs.version }}
        steps:
            - name: Descargar el código
              uses: actions/checkout@v4

            - name: Calcular el tag de la imagen desde la versión
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: gianluca189120/tp-devops-gianluca
                  tags: |
                      type=semver,pattern={{version}}
                  flavor: |
                      latest=false

            - name: Iniciar sesión en Docker Hub
              uses: docker/login-action@v3
              with:
                  username: gianluca189120
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Construir y publicar la imagen
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  build-args: |
                      APP_VERSION=${{ steps.meta.outputs.version }}

    deploy:
        name: Desplegar en Render
        needs: docker
        runs-on: ubuntu-latest
        steps:
            - name: Llamar al Deploy Hook con la versión publicada
              env:
                  RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
                  IMAGEN: docker.io/gianluca189120/tp-devops-gianluca:${{ needs.docker.outputs.version }}
              run: |
                  echo "Desplegando $IMAGEN"
                  curl --fail --silent --show-error --get --data-urlencode "imgURL=$IMAGEN" "$RENDER_DEPLOY_HOOK"
